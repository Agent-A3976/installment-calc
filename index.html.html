<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#F2B544">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="คำนวณผ่อน">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คำนวณยอดผ่อน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EFEE; --card:#FFFFFF; --ink:#13302F; --muted:#5B7270;
  --line:#CFDAD8; --brand:#0F5257; --gold:#F2B544; --gold-ink:#3A2A05;
  --err:#B3261E; --field:#F5F8F7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1C1C; --card:#152828; --ink:#E4EEEC; --muted:#93AAA7;
    --line:#2A4241; --brand:#6FC2C3; --gold:#F2B544; --gold-ink:#2A1E02;
    --err:#F2867E; --field:#1B3332;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1C1C; --card:#152828; --ink:#E4EEEC; --muted:#93AAA7;
  --line:#2A4241; --brand:#6FC2C3; --gold:#F2B544; --gold-ink:#2A1E02;
  --err:#F2867E; --field:#1B3332;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Thai","Noto Sans Thai",Tahoma,system-ui,sans-serif;
  font-size:16px; line-height:1.6;
}
main{max-width:560px; margin:0 auto; padding:1.5rem 1rem 3rem}
h1{font-size:1.6rem; margin:.25rem 0 .25rem; color:var(--brand); font-weight:700}
.sub{margin:0 0 1.25rem; color:var(--muted)}
section{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1.1rem 1.1rem 1.2rem; margin-bottom:1rem}
h2{font-size:1.05rem; margin:0 0 .8rem; font-weight:600}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem}
.grid.two{grid-template-columns:repeat(2,1fr)}
label{display:block; font-size:.88rem; color:var(--muted); margin-bottom:.25rem}
input{
  width:100%; font:inherit; font-size:1.15rem; font-weight:600; color:var(--ink);
  background:var(--field); border:1.5px solid var(--line); border-radius:10px;
  padding:.55rem .65rem; font-variant-numeric:tabular-nums;
}
input:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.note{margin:.7rem 0 0; font-size:.9rem; color:var(--muted)}
.note b{color:var(--ink)}
.result{
  background:var(--gold); color:var(--gold-ink); border-radius:14px;
  padding:1.1rem 1.2rem; margin-bottom:1rem;
}
.result .label{font-size:.95rem; font-weight:500}
.result .big{font-size:clamp(2.4rem,11vw,3.4rem); font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums; word-break:break-all}
.result .big small{font-size:1.1rem; font-weight:600; margin-left:.3rem}
.result .detail{margin-top:.5rem; font-size:.92rem; border-top:1px dashed color-mix(in srgb,var(--gold-ink) 40%,transparent); padding-top:.5rem}
.result.error{background:color-mix(in srgb,var(--err) 15%,var(--card)); color:var(--err)}
.quick{display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.6rem}
.quick button{
  font:inherit; font-size:.9rem; border:1.5px solid var(--line); background:var(--field);
  color:var(--ink); border-radius:999px; padding:.25rem .8rem; cursor:pointer;
}
.quick button:hover,.quick button.on{border-color:var(--brand); color:var(--brand)}
.quick button:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
.tabs{display:grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--field); border:1.5px solid var(--line); border-radius:12px; padding:4px; margin-bottom:.9rem}
.tabs button{font:inherit; font-size:.98rem; font-weight:600; border:0; border-radius:9px; padding:.55rem .4rem; background:transparent; color:var(--muted); cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--brand); color:var(--card)}
.tabs button:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
[hidden]{display:none!important}
.table-wrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
th,td{padding:.45rem .3rem; text-align:right; border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:.85rem; color:var(--muted); font-weight:500}
tr.cur td{color:var(--brand); font-weight:700}
.result{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; box-shadow:0 6px 16px -10px rgba(0,0,0,.35)}
@media (max-width:600px){
  main{padding:1rem .75rem 2.5rem}
  h1{font-size:1.35rem}
  .sub{margin-bottom:.8rem}
  .result{padding:.75rem 1rem; border-radius:0 0 14px 14px; margin-left:-.75rem; margin-right:-.75rem}
  .result .big{font-size:2.2rem}
  .result .detail{font-size:.85rem}
  input{font-size:1.2rem; padding:.7rem .7rem}
  .quick button{padding:.45rem .95rem; font-size:1rem}
}
@media (max-width:420px){ .grid{grid-template-columns:1fr 1fr} .grid .span{grid-column:1 / -1} }
</style>
</head>
<body>
<main>
  <h1>คำนวณยอดผ่อน</h1>
  <p class="sub">ยอดรวมเท่าเดิม เปลี่ยนเงินดาวน์ ค่างวด หรือจำนวนงวดได้</p>

  <div class="result" id="result" aria-live="polite"></div>

  <section>
    <h2>เงื่อนไขปกติของสินค้า</h2>
    <div class="grid">
      <div><label for="d0">เงินดาวน์</label><input id="d0" inputmode="decimal" value="2900"></div>
      <div><label for="p0">ผ่อนงวดละ</label><input id="p0" inputmode="decimal" value="2600"></div>
      <div class="span"><label for="n0">จำนวนงวด</label><input id="n0" inputmode="numeric" value="12"></div>
    </div>
    <p class="note">ยอดรวมทั้งหมด <b id="total">-</b> บาท</p>
  </section>

  <section>
    <h2>ลูกค้าต้องการ</h2>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabPay" aria-selected="true">รู้เงินดาวน์ → หาค่างวด</button>
      <button type="button" role="tab" id="tabDown" aria-selected="false">รู้ค่างวด → หาเงินดาวน์</button>
    </div>
    <div class="grid two">
      <div id="boxD1"><label for="d1">เงินดาวน์</label><input id="d1" inputmode="decimal" value="10000"></div>
      <div id="boxP1" hidden><label for="p1">อยากผ่อนงวดละ</label><input id="p1" inputmode="decimal" value="2000"></div>
      <div><label for="n1">จำนวนงวด</label><input id="n1" inputmode="numeric" value="12"></div>
    </div>
    <div class="quick" id="quick" aria-label="เลือกจำนวนงวดด่วน"></div>
  </section>

  <section>
    <h2 id="cmpTitle">เทียบจำนวนงวดอื่น</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>จำนวนงวด</th><th id="cmpCol">ผ่อนงวดละ (บาท)</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const num = el => { const v = parseFloat(String(el.value).replace(/,/g,'')); return isNaN(v) ? 0 : v; };
const fmt = v => v.toLocaleString('th-TH',{minimumFractionDigits:2, maximumFractionDigits:2});
const fmt0 = v => v.toLocaleString('th-TH',{maximumFractionDigits:2});
const QUICK = [1,2,3,4,6,10,12];
let mode = 'pay'; // 'pay' = find installment, 'down' = find down payment

function setMode(m){
  mode = m;
  $('tabPay').setAttribute('aria-selected', m==='pay');
  $('tabDown').setAttribute('aria-selected', m==='down');
  $('boxD1').hidden = m!=='pay';
  $('boxP1').hidden = m!=='down';
  calc();
}

function buildQuick(){
  $('quick').innerHTML = QUICK.map(n => `<button type="button" data-n="${n}">${n} งวด</button>`).join('');
  $('quick').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    $('n1').value = b.dataset.n; calc();
  });
}

function showError(msg){
  const r = $('result'); r.classList.add('error');
  r.innerHTML = `<div class="label">${msg}</div>`;
}

function calc(){
  const d0 = num($('d0')), p0 = num($('p0')), n0 = Math.round(num($('n0')));
  const n1 = Math.round(num($('n1')));
  const total = d0 + p0 * n0;
  $('total').textContent = fmt0(total);
  document.querySelectorAll('#quick button').forEach(b => b.classList.toggle('on', +b.dataset.n === n1));
  const rows = [...new Set([...QUICK, n1])].filter(n => n >= 1).sort((a,b)=>a-b);
  const r = $('result'); r.classList.remove('error');

  if (mode === 'pay') {
    const d1 = num($('d1'));
    const remain = total - d1;
    $('cmpTitle').textContent = `เทียบจำนวนงวดอื่น (ดาวน์ ${fmt0(d1)} บาท)`;
    $('cmpCol').textContent = 'ผ่อนงวดละ (บาท)';
    if (n1 < 1) return showError('ใส่จำนวนงวดอย่างน้อย 1 งวด'), $('tbody').innerHTML='';
    if (remain < 0) { $('tbody').innerHTML='<tr><td colspan="2">-</td></tr>'; return showError(`เงินดาวน์เกินยอดรวม ${fmt0(-remain)} บาท ลองลดเงินดาวน์ลง`); }
    r.innerHTML = `
      <div class="label">ลูกค้าผ่อนงวดละ</div>
      <div class="big">${fmt(remain / n1)}<small>บาท × ${n1} งวด</small></div>
      <div class="detail">ยอดรวม ${fmt0(total)} − ดาวน์ ${fmt0(d1)} = เหลือผ่อน ${fmt0(remain)} บาท</div>`;
    $('tbody').innerHTML = rows.map(n => `<tr class="${n===n1?'cur':''}"><td>${n} งวด</td><td>${fmt(remain/n)}</td></tr>`).join('');
  } else {
    const p1 = num($('p1'));
    $('cmpTitle').textContent = `เทียบจำนวนงวดอื่น (ผ่อนงวดละ ${fmt0(p1)} บาท)`;
    $('cmpCol').textContent = 'ต้องดาวน์ (บาท)';
    const downFor = n => total - p1 * n;
    const cell = n => { const d = downFor(n); return d <= 0 ? 'ไม่ต้องดาวน์' : fmt(d); };
    $('tbody').innerHTML = rows.map(n => `<tr class="${n===n1?'cur':''}"><td>${n} งวด</td><td>${cell(n)}</td></tr>`).join('');
    if (n1 < 1) return showError('ใส่จำนวนงวดอย่างน้อย 1 งวด');
    if (p1 <= 0) return showError('ใส่ค่างวดที่ลูกค้าอยากผ่อน');
    const need = downFor(n1);
    if (need <= 0) {
      r.innerHTML = `
        <div class="label">ไม่ต้องดาวน์เลย</div>
        <div class="big">0.00<small>บาท</small></div>
        <div class="detail">ผ่อน ${fmt0(p1)} × ${n1} งวด = ${fmt0(p1*n1)} เกินยอดรวม ${fmt0(total)} แล้ว<br>ถ้าไม่ดาวน์ ผ่อนจริงงวดละ ${fmt(total/n1)} บาท</div>`;
    } else {
      r.innerHTML = `
        <div class="label">ลูกค้าต้องดาวน์</div>
        <div class="big">${fmt(need)}<small>บาท</small></div>
        <div class="detail">ยอดรวม ${fmt0(total)} − (ผ่อน ${fmt0(p1)} × ${n1} งวด = ${fmt0(p1*n1)}) = ดาวน์ ${fmt0(need)} บาท</div>`;
    }
  }
}

buildQuick();
$('tabPay').addEventListener('click', () => setMode('pay'));
$('tabDown').addEventListener('click', () => setMode('down'));
['d0','p0','n0','d1','p1','n1'].forEach(id => {
  $(id).addEventListener('input', calc);
  $(id).addEventListener('focus', e => e.target.select());
});
calc();
</script>
</body>
</html>
